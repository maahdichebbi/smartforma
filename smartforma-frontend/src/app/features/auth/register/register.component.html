<div class="auth-page">
  <div class="auth-card card">
    <div class="card-header">
      <div>
        <h1 class="card-title">Créer un compte</h1>
        <p class="auth-subtitle">Inscription apprenant uniquement — pas de compte administrateur public.</p>
      </div>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-prenom">Prénom *</label>
            <input id="reg-prenom" type="text" class="form-control" formControlName="prenom"
              [class.is-invalid]="isInvalid('prenom')" autocomplete="given-name" />
            <div class="form-error" *ngIf="isInvalid('prenom')">Le prénom est obligatoire.</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-nom">Nom *</label>
            <input id="reg-nom" type="text" class="form-control" formControlName="nom"
              [class.is-invalid]="isInvalid('nom')" autocomplete="family-name" />
            <div class="form-error" *ngIf="isInvalid('nom')">Le nom est obligatoire.</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email *</label>
          <input id="reg-email" type="email" class="form-control" formControlName="email"
            [class.is-invalid]="isInvalid('email')" autocomplete="email" />
          <div class="form-error" *ngIf="isInvalid('email')">Email invalide.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Mot de passe *</label>
          <div class="password-field">
            <input id="reg-password" [type]="showPassword() ? 'text' : 'password'" class="form-control"
              formControlName="password" [class.is-invalid]="isInvalid('password')" autocomplete="new-password"
              placeholder="Au moins 8 caractères"
              (keydown)="onPasswordKey($event)"
              (keyup)="onPasswordKey($event)"
              (blur)="onPasswordBlur()" />
            <button type="button" class="password-toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <svg *ngIf="!showPassword()" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                <circle cx="12" cy="12" r="3" stroke-width="2"/>
              </svg>
              <svg *ngIf="showPassword()" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <div class="caps-hint" *ngIf="capsLockOn()">Verr. Maj. activé — vous écrivez en majuscules.</div>
          <div class="form-error" *ngIf="isInvalid('password')">Minimum 8 caractères.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-niveau">Niveau</label>
          <select id="reg-niveau" class="form-control" formControlName="niveau">
            <option *ngFor="let n of niveaux" [value]="n">{{ n }}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-competences">Compétences</label>
          <input id="reg-competences" type="text" class="form-control" formControlName="competences"
            placeholder="ex. Java, Spring Boot" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-interets">Intérêts</label>
          <input id="reg-interets" type="text" class="form-control" formControlName="interets"
            placeholder="ex. Backend, DevOps" />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" [disabled]="submitting()">
          {{ submitting() ? 'Création…' : 'Créer mon compte' }}
        </button>
      </form>
    </div>
    <div class="card-footer auth-footer">
      Déjà inscrit ?
      <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
