spring.application.name=smartforma

# Optional local overrides. This file is ignored by Git and holds local secrets.
# classpath supports IDE/Maven runs; file supports a packaged application run.
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# =====================================================
# MySQL DataSource (XAMPP defaults)
# =====================================================
spring.datasource.url=${SMARTFORMA_DB_URL:jdbc:mysql://localhost:3306/smartforma_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SMARTFORMA_DB_USERNAME:root}
spring.datasource.password=${SMARTFORMA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
# update = create tables if missing, alter if schema changed — safe for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 7 — no need to set it manually
# Keep open-in-view enabled so lazy associations can be serialized by Jackson
spring.jpa.open-in-view=true

# =====================================================
# Server
# =====================================================
server.port=8080

# =====================================================
# JWT (HMAC-SHA256 — secret must be at least 32 characters)
# =====================================================
smartforma.jwt.secret=${SMARTFORMA_JWT_SECRET}
smartforma.jwt.expiration-ms=86400000

# Seeded ADMIN account (created on startup if missing — not a public registration endpoint)
smartforma.admin.email=${SMARTFORMA_ADMIN_EMAIL:admin@smartforma.local}
smartforma.admin.password=${SMARTFORMA_ADMIN_PASSWORD}
