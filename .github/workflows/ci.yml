name: SmartForma CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Spring Boot)
    runs-on: ubuntu-latest
    env:
      # Test-only values. Deployment credentials are never stored in this workflow.
      SMARTFORMA_JWT_SECRET: SmartFormaCiJwtSecretKeyThatIsAtLeast32CharsLong
      SMARTFORMA_ADMIN_PASSWORD: CiAdmin123!

    # Temporary database created only for this CI job.
    # It matches application.properties: localhost:3306 / smartforma_db / root / no password.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smartforma_db
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

      # Verifies the most important demo security flow against a real Spring Boot process.
      - name: Security API smoke test
        run: |
          mvn --batch-mode --no-transfer-progress spring-boot:run > backend.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8080/api/v1/formations > /dev/null; then
              break
            fi
            sleep 2
          done

          # Public catalogue remains available without authentication.
          curl --silent --show-error --fail http://localhost:8080/api/v1/formations > /dev/null

          # A protected write operation must be denied without a JWT.
          unauthenticated_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST http://localhost:8080/api/v1/formations \
            --header "Content-Type: application/json" \
            --data '{}')
          test "$unauthenticated_status" = "401"

          # Seeded CI admin account can authenticate and access its own account endpoint.
          token=$(curl --silent --show-error --fail \
            --request POST http://localhost:8080/api/v1/auth/login \
            --header "Content-Type: application/json" \
            --data '{"email":"admin@smartforma.local","password":"CiAdmin123!"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $token" \
            http://localhost:8080/api/v1/auth/me > /dev/null

  frontend:
    name: Frontend build (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smartforma-frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartforma-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build
