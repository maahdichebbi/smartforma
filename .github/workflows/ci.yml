name: SmartForma CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Spring Boot)
    runs-on: ubuntu-latest
    env:
      # Test-only values. Deployment credentials are never stored in this workflow.
      SMARTFORMA_JWT_SECRET: SmartFormaCiJwtSecretKeyThatIsAtLeast32CharsLong
      SMARTFORMA_ADMIN_PASSWORD: CiAdmin123!

    # Temporary database created only for this CI job.
    # It matches application.properties: localhost:3306 / smartforma_db / root / no password.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smartforma_db
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smartforma-frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smartforma-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build
